      - "One-page site with your hours, services, phone button and map"
      - "Mobile friendly"
      - "Hosting on a free subdomain"
  - id: standard
    name: "Standard site"
    price_usd: 499          # EXAMPLE
    monthly_usd: 25         # EXAMPLE
    includes:
      - "Everything in Starter"
      - "Your own domain name set up"
      - "Contact form that emails you"
