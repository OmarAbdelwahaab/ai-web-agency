[project]
name = "ai-web-agency"
version = "0.1.0"
description = "Lead finder, AI voice caller (LiveKit), and instant site builder for a local-business web agency"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "phonenumbers>=8.13",
  "timezonefinder>=6.5",
  "openai>=1.40",
]

[project.optional-dependencies]
voice = [
  "livekit-agents>=1.0",
  "livekit-api>=1.0",
  "livekit-plugins-silero",
  "livekit-plugins-deepgram",
  "livekit-plugins-cartesia",
  "livekit-plugins-groq",
]
dev = ["pytest>=8.0"]

[project.scripts]
agency = "agency.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agency.sitegen" = ["templates/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
